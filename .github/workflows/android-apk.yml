name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'comfyui-mobile-starter/client/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install React dependencies
        working-directory: comfyui-mobile-starter/client
        run: npm install

      - name: Build React app
        working-directory: comfyui-mobile-starter/client
        run: npm run build

      - name: Copy React build to Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          rm -rf android/app/src/main/assets/www/*
          cp -R comfyui-mobile-starter/client/dist/. android/app/src/main/assets/www/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUI-Mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
