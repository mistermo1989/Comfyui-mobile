<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d18"><title>ComfyUI Mobile</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif;background:#080d18;color:#eef2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#292253 0,transparent 42%),#080d18;min-height:100vh}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:88px}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #202b43;background:#0c1322eF;position:sticky;top:0;z-index:2}.brand{display:flex;align-items:center;gap:10px;font-weight:750}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#8175ff,#4438bd);display:grid;place-items:center;font-size:21px}.sub{display:block;color:#8795b3;font-size:10px;font-weight:400}.status{font-size:10px;color:#9cadd0;border:1px solid #30405e;border-radius:20px;padding:7px 9px}main{padding:18px}.hero{border:1px solid #39366c;border-radius:20px;padding:21px;background:linear-gradient(120deg,#252d62,#151c39 70%,#29224d);min-height:160px}.eyebrow{color:#b1aaff;font-size:10px;letter-spacing:1.7px}.hero h1{font-size:29px;line-height:1.18;margin:10px 0}.hero p,.muted{color:#9aa8c4;font-size:12px;line-height:1.65}.head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.head h2{font-size:15px;margin:0}.btn{border:1px solid #394967;border-radius:10px;padding:10px 13px;background:#19243a;color:#e6eaff;font-size:12px}.primary{background:#6d63f2;border:0;color:white}.danger{background:#3b2030;border-color:#603044;color:#ffb1c0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat,.panel,.pod,.empty,.tile{border:1px solid #273650;background:#111b2d;border-radius:14px;padding:14px}.stat b{font-size:22px;display:block;margin:7px 0 2px}.stat small{color:#9aa8c4;font-size:10px}.stat .ico{color:#a69fff;font-size:18px}.empty{text-align:center;padding:28px 14px;color:#a9b6d0}.empty strong{display:block;margin:8px}.empty small{font-size:11px;color:#8796b4}.pod{margin:10px 0}.podrow{display:flex;justify-content:space-between;gap:10px}.podid{color:#91a0bd;font-size:10px;margin-top:4px;word-break:break-all}.pill{font-size:10px;color:#c1c9e3;background:#25314d;border-radius:20px;padding:5px 8px;height:max-content}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{font-size:12px;text-align:left;color:#e8eaff;padding:16px}.tile span{display:block;color:#aaa2ff;font-size:20px;margin-bottom:8px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:76px;padding-bottom:env(safe-area-inset-bottom);background:#0d1525f5;border-top:1px solid #26334b;display:flex;justify-content:space-around;z-index:3}.nav button{border:0;background:none;color:#7888a6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:55px;font-size:18px}.nav button.active{color:#aaa2ff}.nav small{font-size:10px}.page{min-height:60vh}.page h1{font-size:24px}.panel{margin:12px 0}.panel label{display:block;font-size:12px;margin:10px 0 7px}.field{width:100%;padding:12px;background:#0b1322;border:1px solid #34415e;border-radius:10px;color:#fff;font:inherit;font-size:13px}.wide{width:100%;margin-top:12px}.hint{font-size:11px;color:#93a2bf;line-height:1.6}.warn{border:1px solid #65452d;background:#2a211b;color:#ffd7a8;padding:12px;border-radius:12px;font-size:12px;line-height:1.6}.error{color:#ff9fb1;background:#3b1e2b;border-radius:10px;padding:10px;font-size:12px;margin:12px 0}.ok{color:#82e7bd;font-size:12px}.section-title{font-size:13px;margin:20px 0 8px}.placeholder{padding:38px 10px;text-align:center}.placeholder .big{font-size:42px}.placeholder p{font-size:13px;line-height:1.7;color:#9aa8c4}.tiny{font-size:10px;color:#8190ad}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">▧</div><div>ComfyUI Mobile<span class="sub">RunPod GPU workspace</span></div></div><span class="status">● Mobile Preview</span></header><main id="view"></main><nav class="nav"><button data-tab="Home" class="active">⌂<small>หน้าหลัก</small></button><button data-tab="Generate">▧<small>สร้างภาพ</small></button><button data-tab="Models">◈<small>โมเดล</small></button><button data-tab="Queue">◷<small>คิวงาน</small></button><button data-tab="Settings">⚙<small>ตั้งค่า</small></button></nav></div>
<script>
const $=s=>document.querySelector(s);let tab='Home',pods=[],busy=false;const cfg=()=>({url:(localStorage.apiUrl||'').replace(/\/$/,''),secret:localStorage.appSecret||''});
async function request(path,opts={}){const c=cfg();if(!c.url)throw Error('กรุณาตั้งค่า Backend URL ก่อน');const r=await fetch(c.url+'/api'+path,{...opts,headers:{'Content-Type':'application/json','x-app-secret':c.secret,...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const v=$('#view');if(tab==='Home')v.innerHTML=home();if(tab==='Generate')v.innerHTML=placeholder('▧','สร้างภาพ','Text to Image และ Image to Image จะเชื่อมกับ ComfyUI Workflow ในขั้นถัดไป');if(tab==='Models')v.innerHTML=placeholder('◈','Model Manager','Civitai · Hugging Face · Direct URL · Download Queue');if(tab==='Queue')v.innerHTML=placeholder('◷','Queue','ติดตามสถานะการสร้างภาพและดาวน์โหลดโมเดล');if(tab==='Settings')v.innerHTML=settings();bind()}
function home(){return `<section class="hero"><span class="eyebrow">YOUR AI WORKSPACE</span><h1>สร้างภาพได้<br>จากทุกที่</h1><p>จัดการ GPU, โมเดล และ ComfyUI ผ่านมือถือ</p></section><div id="msg"></div><div class="head"><h2>RunPod Overview</h2><button class="btn" id="refresh">↻ รีเฟรช</button></div><div class="stats"><div class="stat"><span class="ico">▣</span><b>${pods.length}</b><small>Pods</small></div><div class="stat"><span class="ico">▤</span><b>0</b><small>Network Volumes</small></div><div class="stat"><span class="ico">⌑</span><b>API</b><small>Protected</small></div></div><div class="head"><h2>Pods ของฉัน</h2></div>${pods.length?pods.map(p=>`<article class="pod"><div class="podrow"><div><b>${esc(p.name||p.id)}</b><div class="podid">${esc(p.id)}</div></div><span class="pill">${esc(p.desiredStatus||'Pod')}</span></div><div class="actions"><button class="btn" data-action="start" data-id="${esc(p.id)}">Start</button><button class="btn" data-action="stop" data-id="${esc(p.id)}">Stop</button><button class="btn danger" data-action="terminate" data-id="${esc(p.id)}">Terminate</button></div></article>`).join(''):`<div class="empty">☁<strong>ยังไม่พบ Pod</strong><small>ตั้งค่า Backend URL และ App Secret ในหน้าตั้งค่า แล้วกดรีเฟรช</small></div>`}<div class="head"><h2>ทางลัด</h2></div><div class="tiles"><button class="tile" data-go="Generate"><span>▧</span>สร้างภาพ</button><button class="tile" data-go="Models"><span>◈</span>จัดการโมเดล</button></div><p class="tiny">Pod ใช้ Container Disk ชั่วคราวเท่านั้น ไม่มี Network Volume</p>`}
function placeholder(icon,title,detail){return `<div class="page placeholder"><div class="big">${icon}</div><h1>${title}</h1><p>${detail}</p><span class="pill">กำลังพัฒนา</span></div>`}
function settings(){const c=cfg();return `<div class="page"><h1>ตั้งค่า</h1><div class="panel"><b>การเชื่อมต่อ Backend</b><label>Backend URL (HTTPS)</label><input class="field" id="apiUrl" value="${esc(c.url)}" placeholder="https://your-api.example.com"><label>App API Secret</label><input class="field" id="secret" type="password" value="${esc(c.secret)}" placeholder="ใส่ App API Secret"><button class="btn primary wide" id="save">บันทึกการเชื่อมต่อ</button><button class="btn wide" id="test">ทดสอบการเชื่อมต่อ</button><div id="testMsg" class="hint"></div></div><div class="panel"><b>นโยบายพื้นที่จัดเก็บ</b><p class="hint">ใช้ Container Disk ภายใน Pod เท่านั้น ไม่สร้าง Network Volume เมื่อ Terminate Pod โมเดล, LoRA, Custom Nodes และไฟล์ใน Pod จะถูกลบถาวร ต้องดาวน์โหลดใหม่เมื่อเริ่มใช้งานครั้งถัดไป</p></div><div class="warn">⚠ ก่อน Terminate ให้ดาวน์โหลดภาพที่ต้องการเก็บลงมือถือก่อน การ Terminate เป็นการลบ Pod ถาวรและย้อนกลับไม่ได้</div><p class="tiny">ComfyUI Mobile · Prototype 0.1.0</p></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bind(){const r=$('#refresh');if(r)r.onclick=refresh;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>podAction(b.dataset.id,b.dataset.action));const save=$('#save');if(save)save.onclick=()=>{localStorage.apiUrl=$('#apiUrl').value.trim();localStorage.appSecret=$('#secret').value;$('#testMsg').textContent='บันทึกแล้ว';};const test=$('#test');if(test)test.onclick=async()=>{localStorage.apiUrl=$('#apiUrl').value.trim();localStorage.appSecret=$('#secret').value;const m=$('#testMsg');m.textContent='กำลังทดสอบ…';try{await request('/health');m.textContent='เชื่อมต่อ Backend สำเร็จ';m.className='ok'}catch(e){m.textContent=e.message;m.className='error'}}}
async function refresh(){if(busy)return;busy=true;const m=$('#msg');if(m)m.textContent='กำลังโหลด…';try{const d=await request('/runpod/pods');pods=Array.isArray(d)?d:(d.pods||[]);render()}catch(e){if(m)m.innerHTML=`<div class="error">${esc(e.message)}</div>`}finally{busy=false}}
async function podAction(id,action){if(action==='terminate'&&!confirm('ยืนยัน Terminate Pod? Pod และข้อมูลทั้งหมดในดิสก์จะถูกลบถาวร และต้องดาวน์โหลดโมเดลใหม่ในครั้งหน้า'))return;try{await request('/runpod/pods/'+encodeURIComponent(id)+(action==='terminate'?'':'/'+action),{method:action==='terminate'?'DELETE':'POST'});await refresh()}catch(e){const m=$('#msg');if(m)m.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
